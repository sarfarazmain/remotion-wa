# Trigger a Render deploy on every push to main.
#
# Render's GitHub App webhook is unreliable — it silently stops firing
# after environment updates (known Render free-tier quirk). This workflow
# calls the Render Deploy Hook directly from GitHub Actions, bypassing
# the webhook entirely.
#
# Setup (one-time):
#   1. Render Dashboard → warp-dashboard → Settings → Build & Deploy
#   2. Copy the Deploy Hook URL (click the eye icon to reveal, then copy)
#   3. GitHub repo → Settings → Secrets and variables → Actions → New secret
#      Name:  RENDER_DEPLOY_HOOK_URL
#      Value: https://api.render.com/deploy/srv-...?key=...
#
name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render deploy hook
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            --silent --show-error \
            --retry 3 --retry-delay 5 \
            -w "\nHTTP status: %{http_code}\n"
